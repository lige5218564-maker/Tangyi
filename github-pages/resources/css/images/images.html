      "title": "权限配置规则",
      "contentMarkdown": "### 权限配置规则\n菜单管理影响用户能看到哪些菜单、按钮和数据。保存配置后，应及时同步到用户会话或在下次登录生效。\n\n### 风险\n错误配置可能导致越权访问或关键功能不可用。\n\n### 状态与异常\n- 保存失败时保留当前输入内容，并提示失败原因。\n- 无权限或状态不满足时禁用操作，并给出明确提示。\n\n### 待确认\n- 具体字段必填、枚举来源和校验阈值需由业务方确认。",

      "title": "高风险操作",
      "contentMarkdown": "### 业务含义\n该操作属于权限后台的高风险操作，影响用户可访问的角色、菜单或功能范围。\n\n### 点击结果\n用户点击删除、停用、解除授权或隐藏菜单后，系统应弹出二次确认；确认后提交变更并刷新当前列表或权限树。\n\n### 成功反馈\n操作成功后显示成功提示，并同步更新角色授权、菜单状态或用户可见入口。\n\n### 失败处理\n操作失败时保留原状态，提示失败原因；若因权限不足失败，应提示无权限并阻止继续操作。\n\n### 待确认\n- 变更是否立即影响在线用户，还是下次登录生效。\n- 是否需要写入权限变更审计日志。",
